services:
  banking-service:
    image: gerso/banking-service:v3
    container_name: banking-service-container
    environment:
      - QUARKUS_CLIENT_HTTP=host.docker.internal
      - QUARKUS_CLIENT_HTTP_PORT=8181
      - QUARKUS_DATASOURCE_USERNAME=gerson
      - QUARKUS_DATASOURCE_PASSWORD=gerson
      - QUARKUS_DATASOURCE_JDBC_URL=jdbc:postgresql://postgres-db-alura-banking-service:5432/agencia
    ports:
      - "8080:8080"
    depends_on:
      - postgres-db-alura-banking-service
  
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
  
  grafana:
    image: grafana/grafana:latest
    container_name: grafana-compose
    ports:
      - "6000:3000"
    depends_on:
      - prometheus
  
  postgres-db-alura-banking-service:
    image: postgres:14
    container_name: postgres-db-alura-banking-service-container
    environment:
      - POSTGRES_USER=gerson
      - POSTGRES_PASSWORD=gerson
      - POSTGRES_DB=agencia
    ports:
      - 5433:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
volumes:
  postgres_data:
    driver: local